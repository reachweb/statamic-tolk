tabs:
  general:
    display: General
    sections:
      -
        fields:
          -
            handle: translator_model
            field:
              type: tolk_model
              role: translator
              display: 'Translator model'
              instructions: 'The AI model that translates your content. Automatic uses the recommended model of the first provider with an API key. To use a model that is not listed, type it as `provider:model`.'
          -
            handle: review_enabled
            field:
              type: toggle
              display: 'Review translations'
              instructions: 'A second model checks every translation and corrects what it would change. This roughly doubles the time and the cost of each translation. You can still turn review on or off for a single translation.'
              default: false
          -
            handle: reviewer_model
            field:
              type: tolk_model
              role: reviewer
              display: 'Reviewer model'
              instructions: 'The model that checks the translations. Automatic uses the recommended model of another provider with an API key, or the translator when there is no other.'
              always_save: true
              if:
                review_enabled: 'equals true'
          -
            handle: fallback_model
            field:
              type: tolk_model
              role: fallback
              display: 'Fallback model'
              instructions: 'Takes over when the translator keeps failing, for example while its provider is unavailable.'
          -
            handle: new_localization_status
            field:
              type: button_group
              display: 'New localizations'
              instructions: 'Whether the localizations that bulk translations and the command line create are drafts, or published when their origin is. Existing localizations keep their status, and nothing translated in the editor is saved until you save it.'
              options:
                draft: Draft
                mirror: 'Same as origin'
              default: draft
              validate:
                - 'in:draft,mirror'
          -
            handle: offer_on_create
            field:
              type: toggle
              display: 'Offer to translate new localizations'
              instructions: 'When you create a localization in the editor, offer to fill it with a translation of its origin.'
              default: true
          -
            handle: strict_fields
            field:
              type: toggle
              display: 'Strict fields'
              instructions: 'When part of a field cannot be translated, for example because the model refuses it, the field is normally translated with that part left in the original language, flagged, and tried again on the next update. Turn this on to leave the whole field untranslated instead.'
              default: false
  context:
    display: Context
    sections:
      -
        fields:
          -
            handle: site_profile
            field:
              type: tolk_site_profile
              display: 'Site profile'
              instructions: 'A short description of the organisation, what it offers, its audience and its tone of voice, sent with every translation. Generate writes one from your content with the translator model, and you can edit it as you like.'
              default: ''
              validate:
                - 'new Reach\StatamicTolk\Http\Rules\AntlersText'
          -
            handle: instructions
            field:
              type: textarea
              display: Instructions
              instructions: 'Instructions for every translation, for example on tone, spelling or units. You can write them in any language.'
              default: ''
              validate:
                - 'new Reach\StatamicTolk\Http\Rules\AntlersText'
          -
            handle: language_instructions
            field:
              type: grid
              display: 'Language instructions'
              instructions: 'How to address the reader, and extra instructions, for one language. Each language can have one row.'
              mode: stacked
              add_row: 'Add language'
              default: []
              fields:
                -
                  handle: site
                  field:
                    type: sites
                    display: Site
                    mode: select
                    max_items: 1
                    validate:
                      - required
                      - 'new Reach\StatamicTolk\Http\Rules\UniqueLanguageSite'
                -
                  handle: formality
                  field:
                    type: button_group
                    display: Formality
                    instructions: 'How the translation addresses the reader. Default leaves it to the model.'
                    options:
                      default: Default
                      formal: Formal
                      informal: Informal
                    default: default
                    validate:
                      - 'in:default,formal,informal'
                -
                  handle: instructions
                  field:
                    type: textarea
                    display: Instructions
                    instructions: 'Extra instructions for this language only.'
                    validate:
                      - 'new Reach\StatamicTolk\Http\Rules\AntlersText'
  glossary:
    display: Glossary
    sections:
      -
        fields:
          -
            handle: glossary
            field:
              type: grid
              display: Glossary
              instructions: 'Terms that must always be translated the same way, or not at all. A row for one language replaces a row for every language with the same term.'
              mode: table
              add_row: 'Add term'
              default: []
              fields:
                -
                  handle: term
                  field:
                    type: text
                    display: Term
                    validate:
                      - required
                      - 'new Reach\StatamicTolk\Http\Rules\UniqueGlossaryTerm'
                      - 'new Reach\StatamicTolk\Http\Rules\AntlersText'
                -
                  handle: site
                  field:
                    type: sites
                    display: Site
                    instructions: 'Leave empty for every language.'
                    mode: select
                    max_items: 1
                -
                  handle: translation
                  field:
                    type: text
                    display: Translation
                    validate:
                      - 'new Reach\StatamicTolk\Http\Rules\GlossaryTranslation'
                      - 'new Reach\StatamicTolk\Http\Rules\AntlersText'
                -
                  handle: do_not_translate
                  field:
                    type: toggle
                    display: 'Do not translate'
                -
                  handle: note
                  field:
                    type: text
                    display: Note
                    validate:
                      - 'new Reach\StatamicTolk\Http\Rules\AntlersText'
  content:
    display: Content
    sections:
      -
        fields:
          -
            handle: excluded_collections
            field:
              type: collections
              display: 'Excluded collections'
              instructions: 'Entries of these collections are never translated.'
              mode: select
              default: []
          -
            handle: excluded_taxonomies
            field:
              type: taxonomies
              display: 'Excluded taxonomies'
              instructions: 'Terms of these taxonomies are never translated.'
              mode: select
              default: []
          -
            handle: excluded_fields
            field:
              type: list
              display: 'Excluded fields'
              instructions: 'Top-level fields that are never translated, in every blueprint. Enter each field by its handle, for example `internal_note`. For a field inside a Replicator, Grid or Bard set, switch off its "Translate automatically" option instead.'
              default: []
              validate:
                - 'new Reach\StatamicTolk\Http\Rules\AntlersText'
          -
            handle: translated_slugs
            field:
              type: collections
              display: 'Translated slugs'
              instructions: 'New localizations of these collections get a slug made from their translated title, as Statamic makes slugs. In other collections they keep the slug of their origin. A slug that already exists is never changed.'
              mode: select
              default: []
  automation:
    display: Automation
    sections:
      -
        fields:
          -
            handle: auto_update
            field:
              type: toggle
              display: 'Update translations automatically'
              instructions: 'Each time an entry is saved published in the site its localizations are translated from, they are updated in the background: the fields whose origin changed and the fields not translated yet. Fields edited by hand are never overwritten. Every such save that changes text spends API credit. Each update is a run on the Translations › Runs page.'
              default: false
          -
            handle: auto_update_create
            field:
              type: toggle
              display: 'Create missing localizations'
              instructions: 'Also translate the entry into the sites of its collection that have no localization of it yet. New localizations are drafts, or published when their origin is, as the New localizations setting on the General tab says.'
              default: false
              always_save: true
              if:
                auto_update: 'equals true'
          -
            handle: auto_update_collections
            field:
              type: collections
              display: Collections
              instructions: 'Only the entries of these collections are updated automatically. Leave empty for every collection that is not excluded.'
              mode: select
              default: []
              always_save: true
              if:
                auto_update: 'equals true'
          -
            handle: auto_update_publish
            field:
              type: toggle
              display: 'Publish updates'
              instructions: 'In collections with revisions, an update of a published localization is saved as a working copy and waits until someone publishes it. Turn this on to publish it at once, unless the localization already had unpublished changes.'
              default: false
              always_save: true
              if:
                auto_update: 'equals true'
  providers:
    display: Providers
    sections:
      -
        fields:
          -
            handle: providers
            field:
              type: tolk_providers
              display: Providers
              instructions: 'API keys are read from the `.env` file of your site and are never stored in these settings. Each provider names the variable it needs.'
